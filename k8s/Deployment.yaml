apiVersion: apps/v1
kind: Deployment
metadata:
  name: shiny-app
  namespace: colocation-imb
spec:
  # strategy:
  #   type: RollingUpdate
  #   rollingUpdate:
  #     maxUnavailable: 25%
  #     maxSurge: 25%
  selector:
    matchLabels:
      app: shiny-app
  template:
    metadata:
      labels:
        app: shiny-app
    spec:
      restartPolicy: Always
      serviceAccountName: imb-anyuid
      containers:
      - name: shiny-app
        image: quay.apps.dc1openshiftadm.cloud.go.gov.br/dc1openshifthom_colocation-imb/shiny-ods-is:latest
        ports:
        - containerPort: 8080
        resources:
          requests:
            memory: 512Mi
            cpu: 500m
          limits:
            memory: 4Gi
            cpu: 2
        volumeMounts:
        - name: shiny-app-storage
          mountPath: /app
      volumes:
      - name: shiny-app-storage
        persistentVolumeClaim:
          claimName: shiny-app-pvc